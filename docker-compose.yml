name: placegraph
services:
  mysql:
    image: mysql:8.4
    container_name: placegraph-mysql
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set it in .env}
      MYSQL_USER: ${MYSQL_USER:?set it in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set it in .env}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
  neo4j:
    image: neo4j:5.26-community
    container_name: placegraph-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set it in .env}
    ports:
      - "${NEO4J_HTTP_PORT:-7475}:7474"
      - "${NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_data:/data
volumes:
  mysql_data:
  neo4j_data:
